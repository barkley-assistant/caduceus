# Canonical CI matrix for the Caduceus v1.0 plan.
#
# Implements the CI contract (CI-001, CI-002). Runs on every pull
# request and every push to main. The matrix runs on stable Rust
# with --locked. The MSRV is documented in Cargo.toml
# (rust-version = "1.97") and enforced at compile time — no
# separate MSRV CI job is needed. The Python gate runs the two
# project-required test files only: tests/hermes_plugin_test.py
# and tests/bridge_test.py. The planning validation step runs
# validate_plan.py from the v1.0 controller tools. Artifacts
# are retained for 14 days.
#
# Required-check names:
# - ci / rust-stable
# - ci / python
# - ci / planning
# - ci / oci-live-certification
#
# These names appear in the branch-protection settings; do not
# rename them without coordinating the branch-protection update.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    # The build only fires when Rust, Python, or
    # the workflow files themselves change.
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'RELEASING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  # Option C: a weekly schedule trigger keeps the cargo and
  # target caches warm so the next human push does not pay the
  # cold-cache build cost (5-10 minutes on ubuntu-24.04 with a
  # minimal rustup profile). The trigger runs the full gate under
  # the nextest `nightly` profile, which re-includes the
  # release_binary_canary test excluded from per-push runs (issue
  # #205); because the previous run cached its results, the warm
  # run finishes in under two minutes plus the canary's release
  # build. cron: "0 6 * * 0" is Sunday 06:00 UTC, which is
  # off-peak for the public Actions runner pool.
  schedule:
    - cron: '0 6 * * 0'

# Cancel in-progress runs on the same ref so a force-push does
# not leave a stale runner burning CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-stable:
    name: rust-stable
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install stable Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Same rationale as the rust-msrv job: explicit component
          # install keeps the four-line gate reproducible on cold-cache
          # first runs.
          rustup component add rustfmt clippy
      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      - name: configure git identity for tests
        run: |
          set -euo pipefail
          git config --global user.email "ci@caduceus.local"
          git config --global user.name "caduceus-ci"
      - name: fmt
        run: cargo fmt --check
      - name: test
        # Per-push/PR gate only. profile.default's default-filter
        # excludes release_binary_canary (see .config/nextest.toml).
        if: github.event_name != 'schedule'
        env:
          # Belt-and-suspenders signal for the five hermes_lifecycle
          # tests in tests/integration/hermes_lifecycle_test.rs that
          # self-skip into green on CI. See .config/nextest.toml for
          # the matching override profile. #205 owns the root-cause
          # fix; today the env var is declarative and not read.
          CADUCEUS_SKIP_LIFECYCLE: "1"
        # hermes_lifecycle tests (ac04/ac06/ac07/ac08) each shell out to
        # `hermes caduceus setup` which takes 2-3 minutes to compile the
        # release binary; running four of them in parallel saturates the
        # 240s per-test timeout. Allow up to 15 minutes for the test step.
        timeout-minutes: 15
        run: cargo nextest run --locked --all-targets --retries 2
      - name: test (nightly profile, includes release_binary_canary)
        # Weekly schedule only: profile.nightly inherits profile.default
        # and resets default-filter to all(), re-including the release
        # canary. The five #[ignore]d hermes_lifecycle tests stay
        # skipped in both profiles. Same job, so the check name
        # (ci / rust-stable) is unchanged on every trigger.
        if: github.event_name == 'schedule'
        timeout-minutes: 20
        run: cargo nextest run --locked --all-targets --retries 2 --profile nightly

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install stable Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup component add clippy
      - name: cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      - name: configure git identity
        run: |
          set -euo pipefail
          git config --global user.email "ci@caduceus.local"
          git config --global user.name "caduceus-ci"
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.x"
      - name: sync locked Python dependencies
        run: uv sync --frozen --group test
      - name: run the canonical Python gate
        run: |
          set -euo pipefail
          # Write a JUnit XML next to the runner so the artifact step
          # below can upload it. Without --junit-xml the runner has
          # no test report to surface in the Actions UI.
          uv run pytest -q \
            --junit-xml=pytest-junit.xml \
            tests/plugin/ \
            tests/integration/bridge_test.py
      - name: upload pytest junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: pytest-junit.xml
          retention-days: 14
          if-no-files-found: error

  oci-reference-image:
    # Local build + contract smoke only (D4): the reference worker
    # image is never pushed from CI, and PRs/forks get no registry
    # credentials. Publication happens exclusively from the
    # release-worker-image workflow on `v*` tags. Not a required
    # branch-protection check; existing required names are unchanged.
    name: oci-reference-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: build reference image locally (never pushed)
        run: |
          set -euo pipefail
          docker build --pull \
            -f plugin-assets/worker-reference-image/Containerfile \
            -t caduceus-worker-reference:ci \
            plugin-assets/worker-reference-image
      - name: smoke — default CMD contract summary
        run: |
          set -euo pipefail
          summary="$(docker run --rm caduceus-worker-reference:ci)"
          printf '%s\n' "$summary" | grep -q "caduceus-worker-reference" || {
            echo "expected the default contract summary line" >&2
            exit 1
          }
      - name: smoke — caduceus-env.sh (WR-2)
        run: |
          set -euo pipefail
          full_env=(
            -e CADUCEUS_RUN_ID=ci-smoke
            -e CADUCEUS_ISSUE_ID=ci-smoke
            -e CADUCEUS_ISSUE_NUMBER=1
            -e CADUCEUS_ISSUE_REPO=example/example
            -e CADUCEUS_ISSUE_TITLE="Smoke test"
            -e CADUCEUS_ISSUE_BODY="Smoke body"
            -e 'CADUCEUS_ISSUE_LABELS_JSON=["smoke"]'
            -e 'CADUCEUS_CONTEXT_JSON={"run":"smoke"}'
            -e CADUCEUS_BRANCH_NAME=main
            -e CADUCEUS_WORKTREE_PATH=/workspace
            -e CADUCEUS_RESULT_PATH=/output/worker-result.json
          )
          # names-only: all eleven canonical names, sorted.
          names="$(docker run --rm "${full_env[@]}" \
            caduceus-worker-reference:ci /usr/local/bin/caduceus-env.sh --names-only)"
          test "$(printf '%s\n' "$names" | wc -l)" -eq 11
          for name in \
            CADUCEUS_BRANCH_NAME CADUCEUS_CONTEXT_JSON CADUCEUS_ISSUE_BODY \
            CADUCEUS_ISSUE_ID CADUCEUS_ISSUE_LABELS_JSON CADUCEUS_ISSUE_NUMBER \
            CADUCEUS_ISSUE_REPO CADUCEUS_ISSUE_TITLE CADUCEUS_RESULT_PATH \
            CADUCEUS_RUN_ID CADUCEUS_WORKTREE_PATH
          do
            printf '%s\n' "$names" | grep -qx "$name" || {
              echo "names-only output missing $name" >&2
              exit 1
            }
          done
          # Full mode: NAME=VALUE per line.
          pairs="$(docker run --rm "${full_env[@]}" \
            caduceus-worker-reference:ci /usr/local/bin/caduceus-env.sh)"
          printf '%s\n' "$pairs" | grep -qx 'CADUCEUS_RUN_ID=ci-smoke' || {
            echo "NAME=VALUE output missing CADUCEUS_RUN_ID=ci-smoke" >&2
            exit 1
          }
          # A missing canonical variable must fail loudly and name it.
          missing_env=(
            -e CADUCEUS_RUN_ID=ci-smoke
            -e CADUCEUS_ISSUE_ID=ci-smoke
            -e CADUCEUS_ISSUE_NUMBER=1
            -e CADUCEUS_ISSUE_REPO=example/example
            -e CADUCEUS_ISSUE_TITLE="Smoke test"
            -e CADUCEUS_ISSUE_BODY="Smoke body"
            -e 'CADUCEUS_ISSUE_LABELS_JSON=["smoke"]'
            -e 'CADUCEUS_CONTEXT_JSON={"run":"smoke"}'
            -e CADUCEUS_BRANCH_NAME=main
            -e CADUCEUS_WORKTREE_PATH=/workspace
          )
          if docker run --rm "${missing_env[@]}" \
            caduceus-worker-reference:ci /usr/local/bin/caduceus-env.sh \
            >/dev/null 2>caduceus-env.err; then
            echo "caduceus-env.sh must fail when CADUCEUS_RESULT_PATH is unset" >&2
            exit 1
          fi
          grep -q "CADUCEUS_RESULT_PATH" caduceus-env.err || {
            echo "missing-variable diagnostic must name CADUCEUS_RESULT_PATH" >&2
            exit 1
          }
      - name: smoke — write-result.sh (WR-3)
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          trap 'rm -rf "$out"' EXIT
          env=(
            -e CADUCEUS_RUN_ID=ci-smoke
            -e CADUCEUS_ISSUE_ID=ci-smoke
            -e CADUCEUS_ISSUE_NUMBER=1
            -e CADUCEUS_ISSUE_REPO=example/example
            -e CADUCEUS_ISSUE_TITLE="Smoke test"
            -e CADUCEUS_ISSUE_BODY="Smoke body"
            -e 'CADUCEUS_ISSUE_LABELS_JSON=["smoke"]'
            -e 'CADUCEUS_CONTEXT_JSON={"run":"smoke"}'
            -e CADUCEUS_BRANCH_NAME=main
            -e CADUCEUS_WORKTREE_PATH=/workspace
            -e CADUCEUS_RESULT_PATH=/output/worker-result.json
          )
          # write-result.sh only reads CADUCEUS_RESULT_PATH, but keep the
          # canonical set complete apart from the unset result path.
          env_without_result=(
            -e CADUCEUS_RUN_ID=ci-smoke
            -e CADUCEUS_ISSUE_ID=ci-smoke
            -e CADUCEUS_ISSUE_NUMBER=1
            -e CADUCEUS_ISSUE_REPO=example/example
            -e CADUCEUS_ISSUE_TITLE="Smoke test"
            -e CADUCEUS_ISSUE_BODY="Smoke body"
            -e 'CADUCEUS_ISSUE_LABELS_JSON=["smoke"]'
            -e 'CADUCEUS_CONTEXT_JSON={"run":"smoke"}'
            -e CADUCEUS_BRANCH_NAME=main
            -e CADUCEUS_WORKTREE_PATH=/workspace
          )
          # Honor CADUCEUS_RESULT_PATH: schema-valid document.
          docker run --rm --read-only --tmpfs /tmp:size=64m \
            -v "$out":/output:rw "${env[@]}" \
            caduceus-worker-reference:ci /usr/local/bin/write-result.sh
          python3 - "$out/worker-result.json" <<'PY'
          import json
          import sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          assert doc["status"] == "success", doc
          for field in ("summary", "commit_message", "pull_request_title"):
              assert isinstance(doc[field], str) and doc[field].strip(), field
          PY
          # Default path: no CADUCEUS_RESULT_PATH -> /output/worker-result.json.
          rm -f "$out/worker-result.json"
          docker run --rm --read-only --tmpfs /tmp:size=64m \
            -v "$out":/output:rw "${env_without_result[@]}" \
            caduceus-worker-reference:ci /usr/local/bin/write-result.sh
          test -f "$out/worker-result.json"
          # --status failure stays schema-valid.
          docker run --rm --read-only --tmpfs /tmp:size=64m \
            -v "$out":/output:rw "${env[@]}" \
            caduceus-worker-reference:ci /usr/local/bin/write-result.sh --status failure
          python3 - "$out/worker-result.json" <<'PY'
          import json
          import sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          assert doc["status"] == "failure", doc
          PY
          # Unwritable target: non-zero exit, no partial file.
          if docker run --rm --read-only --tmpfs /tmp:size=64m \
            -v "$out":/output:rw \
            -e CADUCEUS_RESULT_PATH=/proc/worker-result.json \
            -e CADUCEUS_RUN_ID=ci-smoke \
            caduceus-worker-reference:ci /usr/local/bin/write-result.sh \
            >/dev/null 2>&1; then
            echo "write-result.sh must fail on an unwritable target" >&2
            exit 1
          fi
      - name: smoke — probes (WR-4)
        run: |
          set -euo pipefail
          ws="$(mktemp -d)"
          out="$(mktemp -d)"
          trap 'rm -rf "$ws" "$out"' EXIT
          printf 'ci-sentinel\n' > "$ws/sentinel.txt"
          restricted=(
            --read-only --network none --tmpfs /tmp:size=64m
            -v "$ws":/workspace:rw -v "$out":/output:rw
          )
          open=(
            --read-only --tmpfs /tmp:size=64m
            -v "$ws":/workspace:rw -v "$out":/output:rw
          )
          docker run --rm "${restricted[@]}" \
            caduceus-worker-reference:ci /usr/local/bin/worker-probe sentinel-read
          docker run --rm "${restricted[@]}" \
            caduceus-worker-reference:ci /usr/local/bin/worker-probe mount-probe
          docker run --rm "${restricted[@]}" \
            caduceus-worker-reference:ci /usr/local/bin/worker-probe resource-hog 1 1024
          docker run --rm "${restricted[@]}" \
            caduceus-worker-reference:ci /usr/local/bin/worker-probe network-probe none
          # Default network reports reachability either way.
          docker run --rm "${open[@]}" \
            caduceus-worker-reference:ci /usr/local/bin/worker-probe network-probe auto
          # Arbitrary --entrypoint argv is the contract.
          docker run --rm --entrypoint /bin/sh \
            caduceus-worker-reference:ci -c 'echo arbitrary-entrypoint-ok' \
            | grep -q arbitrary-entrypoint-ok
          # Probe failure paths: non-zero exits fail this step.
          rm -f "$ws/sentinel.txt"
          if docker run --rm "${restricted[@]}" \
            caduceus-worker-reference:ci /usr/local/bin/worker-probe sentinel-read \
            </dev/null >/dev/null 2>&1; then
            echo "sentinel-read must fail when the sentinel is missing" >&2
            exit 1
          fi

  oci-live-certification:
    # Live adversarial Docker certification (issue #252): the
    # merge-blocking security gate for executor/config/state/
    # workflow-relevant changes. Drives the gated Rust live suite
    # (oci_isolation_live_test.rs + oci_env_live_test.rs) through the
    # real engine with CADUCEUS_RUN_ISOLATION_TESTS=1 and a
    # digest-pinned reference image, using nextest --run-ignored all.
    # Rootful Docker is the mandatory PR baseline; the rootless and
    # Podman legs are nightly (oci-live-nightly.yml) and release
    # certification runs all modes (release.yml).
    #
    # The job self-skips to SUCCESS (never `skipped`) for out-of-scope
    # PRs via dorny/paths-filter, so a docs-only PR cannot block merge
    # on a skipped required check.
    name: oci-live-certification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: filter security-relevant paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            security:
              - 'src/executor/**'
              - 'src/infra/config/**'
              - 'src/state/oci_run*'
              - 'src/daemon/tick/per_claim.rs'
              - 'plugin-assets/worker-bridge.py'
              - 'plugin-assets/worker-reference-image/**'
              - 'tests/executor/**'
              - 'tests/integration/oci_env_live_test.rs'
              - '.github/workflows/**'
      - name: skip when no security-relevant changes
        if: steps.filter.outputs.security == 'false'
        run: |
          echo "no security-relevant changes in this PR; live certification reports success (not skipped) so merge is not blocked"
      - name: install stable Rust
        if: steps.filter.outputs.security == 'true'
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: install cargo-nextest
        if: steps.filter.outputs.security == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cache cargo registry and target
        if: steps.filter.outputs.security == 'true'
        uses: Swatinem/rust-cache@v2
      - name: configure git identity for tests
        if: steps.filter.outputs.security == 'true'
        run: |
          set -euo pipefail
          git config --global user.email "ci@caduceus.local"
          git config --global user.name "caduceus-ci"
      - name: build reference image locally (never pushed)
        if: steps.filter.outputs.security == 'true'
        run: |
          set -euo pipefail
          docker build --pull \
            -f plugin-assets/worker-reference-image/Containerfile \
            -t caduceus-worker-reference:ci \
            plugin-assets/worker-reference-image
      - name: resolve digest-pinned references via local registry
        if: steps.filter.outputs.security == 'true'
        run: |
          set -euo pipefail
          # A locally built (never pushed) image has no RepoDigest; a
          # throwaway local registry gives every live test the same
          # deterministic digest-pinned reference a released image
          # would have. localhost registries need no TLS config.
          docker run -d -p 127.0.0.1:5000:5000 --name ci-registry registry:2
          docker tag caduceus-worker-reference:ci \
            127.0.0.1:5000/caduceus-worker-reference:ci
          docker push 127.0.0.1:5000/caduceus-worker-reference:ci
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' \
            127.0.0.1:5000/caduceus-worker-reference:ci)"
          echo "CADUCEUS_LIVE_TEST_IMAGE=$digest" >> "$GITHUB_ENV"
          # Image neutrality (issue #252): a second image that does
          # NOT inherit from the reference image.
          docker pull alpine:3.20
          echo "CADUCEUS_LIVE_NEUTRALITY_IMAGE=$(docker inspect \
            --format '{{index .RepoDigests 0}}' alpine:3.20)" >> "$GITHUB_ENV"
      - name: run live certification suite
        if: steps.filter.outputs.security == 'true'
        timeout-minutes: 15
        env:
          CADUCEUS_RUN_ISOLATION_TESTS: "1"
        run: |
          set -euo pipefail
          cargo nextest run --locked --all-targets --run-ignored all \
            -E 'binary(oci_isolation_live_test) or binary(oci_env_live_test) \
                or binary(certification_mapping_test)'
      - name: upload diagnostics on failure
        if: failure() && steps.filter.outputs.security == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oci-live-diagnostics
          path: |
            target/nextest/ci-junit.xml
            **/engine.log
            **/oci-runs/**/*.log
          if-no-files-found: ignore
          retention-days: 14
