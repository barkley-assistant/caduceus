name: release

# Cut a GitHub release from a version tag. This workflow is the
# release's only gate: the main CI workflow is branch-scoped, so a
# tag push runs nothing else. Keep the gates here in sync with
# ci.yml (fmt, clippy -D warnings, cargo test).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  certify-oci:
    # Release certification (issue #252): the live adversarial suite
    # runs in ALL supported modes (rootful Docker, rootless Docker,
    # Podman Tier-2 subset) before the release binary is built. The
    # release job depends on this job.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Configure git identity for tests
        run: |
          set -euo pipefail
          git config --global user.email "ci@caduceus.local"
          git config --global user.name "caduceus-ci"

      - name: certify — rootful Docker
        run: |
          set -euo pipefail
          docker build --pull \
            -f plugin-assets/worker-reference-image/Containerfile \
            -t caduceus-worker-reference:ci \
            plugin-assets/worker-reference-image
          docker run -d -p 127.0.0.1:5000:5000 --name ci-registry registry:2
          docker tag caduceus-worker-reference:ci \
            127.0.0.1:5000/caduceus-worker-reference:ci
          docker push 127.0.0.1:5000/caduceus-worker-reference:ci
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' \
            127.0.0.1:5000/caduceus-worker-reference:ci)"
          docker pull alpine:3.20
          neutrality="$(docker inspect --format '{{index .RepoDigests 0}}' alpine:3.20)"
          CADUCEUS_RUN_ISOLATION_TESTS=1 \
          CADUCEUS_LIVE_TEST_IMAGE="$digest" \
          CADUCEUS_LIVE_NEUTRALITY_IMAGE="$neutrality" \
            cargo nextest run --locked --all-targets --run-ignored all \
            -E 'binary(oci_isolation_live_test) or binary(oci_env_live_test) or binary(certification_mapping_test)'

      - name: certify — rootless Docker
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y uidmap dbus-user-session
          curl --proto '=https' --tlsv1.2 -sSf https://get.docker.com/rootless | sh
          export PATH="$HOME/bin:/usr/bin:$PATH"
          export DOCKER_HOST="unix:///run/user/$(id -u)/docker.sock"
          docker info >/dev/null
          docker build --pull \
            -f plugin-assets/worker-reference-image/Containerfile \
            -t caduceus-worker-reference:ci \
            plugin-assets/worker-reference-image
          docker run -d -p 127.0.0.1:5000:5000 --name ci-registry registry:2
          docker tag caduceus-worker-reference:ci \
            127.0.0.1:5000/caduceus-worker-reference:ci
          docker push 127.0.0.1:5000/caduceus-worker-reference:ci
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' \
            127.0.0.1:5000/caduceus-worker-reference:ci)"
          docker pull alpine:3.20
          neutrality="$(docker inspect --format '{{index .RepoDigests 0}}' alpine:3.20)"
          CADUCEUS_RUN_ISOLATION_TESTS=1 \
          CADUCEUS_LIVE_TEST_IMAGE="$digest" \
          CADUCEUS_LIVE_NEUTRALITY_IMAGE="$neutrality" \
            cargo nextest run --locked --all-targets --run-ignored all \
            -E 'binary(oci_isolation_live_test) or binary(oci_env_live_test) or binary(certification_mapping_test)'

      - name: certify — Podman Tier-2 subset
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
          podman info >/dev/null
          podman pull busybox:1.36.1
          digest="$(podman inspect --format '{{index .RepoDigests 0}}' busybox:1.36.1)"
          podman pull alpine:3.20
          neutrality="$(podman inspect --format '{{index .RepoDigests 0}}' alpine:3.20)"
          CADUCEUS_RUN_ISOLATION_TESTS=1 \
          CADUCEUS_LIVE_TEST_ENGINE=podman \
          CADUCEUS_LIVE_TEST_IMAGE="$digest" \
          CADUCEUS_LIVE_NEUTRALITY_IMAGE="$neutrality" \
            cargo nextest run --locked --all-targets --run-ignored all \
            -E 'binary(oci_isolation_live_test) and (test(git_shadow_read_sees_only_shadow) or test(git_shadow_write_rejected) or test(git_shadow_dir_variant_is_empty_and_read_only) or test(oci_mount_enumeration_two_writable_surfaces) or test(workspace_writable_rootfs_readonly_output_writes_live) or test(capabilities_absent_no_new_privileges_live) or test(podman_keep_id_identity_canary) or test(rootful_docker_identity_canary) or test(timeout_cleans_container_live) or test(cancellation_cleans_container_live) or test(network_none_unreachable_live) or test(unrestricted_not_host_live) or test(image_neutrality_custom_unrelated_image_live) or test(host_sentinel_unreachable_live) or test(daemon_state_and_other_repos_unreachable_live) or test(runtime_socket_and_device_absent_live)) or binary(oci_env_live_test) or binary(certification_mapping_test)'

  release:
    runs-on: ubuntu-latest
    needs: certify-oci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo.toml
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi
          echo "version $cargo_version verified"

      - name: Gate — formatting
        run: cargo fmt --check

      - name: Gate — clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Gate — tests
        run: cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/caduceus-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" \
            -C target/release caduceus
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          ls -la dist

      - name: Extract changelog section for this version
        run: |
          python3 - "$GITHUB_REF_NAME" > release-notes.md <<'EOF'
          import re
          import sys

          tag = sys.argv[1].lstrip("v")
          text = open("CHANGELOG.md").read()
          # Match "## [X.Y.Z] - <date>" through the next "## [" header
          # (or end of file). The [Unreleased] section above it is
          # deliberately not captured.
          match = re.search(
              rf"^## \[{re.escape(tag)}\] - .*?(?=^## \[|\Z)", text, re.M | re.S
          )
          if not match:
              print(
                  f"::error::no changelog section for version {tag} "
                  f"(expected '## [{tag}] - <date>')",
                  file=sys.stderr,
              )
              sys.exit(1)
          sys.stdout.write(match.group(0).rstrip() + "\n")
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*
