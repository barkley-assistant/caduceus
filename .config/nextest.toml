# cargo-nextest configuration for the rust-stable CI gate (issue #203).
#
# [profile.default] sets a per-test slow-timeout of 120s. Tests that take
# longer than this are terminated by nextest. The 120s budget is generous
# on purpose; tighten later from data.
#
# [profile.default] also sets default-filter to exclude the
# release_binary_canary family from per-push runs (issue #205): the
# canary spends ~26s building a release binary and is promoted to the
# weekly schedule trigger, which runs the nightly profile below.
# default-filter applies only when no -E/--filter-expression is passed
# on the command line, so the canary remains runnable ad hoc:
#   cargo nextest run -E 'test(release_binary_canary)'
#
# The override profile below preserves today's effective CI behavior for
# the five hermes_lifecycle tests. As of #205 those tests carry
# #[ignore = "env: requires hermes binary ..."], so libtest and nextest
# skip them by default in every profile; preflight_or_skip() remains as
# a defense-in-depth guard for explicit --ignored / --run-ignored runs
# on hosts without hermes. The override table is kept (issues #203/#206)
# as the natural place to add per-test settings (priority, test-group,
# etc.). It keeps filter + platform only — no per-test slow-timeout —
# so the default 120s applies.

[profile.default]
slow-timeout = "120s"
default-filter = "not test(/release_binary_canary/)"

[[profile.default.overrides]]
filter = "test(test_ac04_cron_install_happy) or test(test_ac06_doctor_and_status) or test(test_ac07_gateway_prerequisite) or test(test_ac08_update_preserves_state) or test(test_ac10_uninstall_preserves_user_state)"
platform = "x86_64-unknown-linux-gnu"

# Weekly profile used by the schedule trigger in ci.yml (issue #205).
# Profiles inherit from `default` unless `inherits` says otherwise, so
# this profile keeps the 120s slow-timeout and the override above, and
# re-includes the release canary by resetting default-filter to all().
[profile.nightly]
inherits = "default"
default-filter = "all()"

# CI profile used by the oci-live-certification job (ci.yml, issue
# #252). Inherits `default` (120s slow-timeout + canary filter) and
# emits a JUnit report so the upload-diagnostics-on-failure artifact
# step has a real file to upload (the report lands at
# target/nextest/ci/junit.xml). This nextest version has no
# `--junit-xml` CLI flag; JUnit output is config-driven only.
[profile.ci]
inherits = "default"

[profile.ci.junit]
path = "junit.xml"
